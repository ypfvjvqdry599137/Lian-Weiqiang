<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>鲜配居管理后台登录</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf4ee; color: #183c2d; font-family: "Microsoft YaHei", sans-serif; }
        main { width: min(360px, calc(100vw - 48px)); padding: 32px; background: white; border-radius: 14px; box-shadow: 0 16px 48px #183c2d1a; }
        h1 { margin: 0 0 24px; font-size: 24px; }
        label { display: block; margin-bottom: 8px; }
        input, button { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; border-radius: 7px; }
        input { border: 1px solid #9eb4a5; }
        button { margin-top: 18px; border: 0; background: #176b43; color: white; cursor: pointer; }
        button:disabled { opacity: .65; cursor: wait; }
        #error { min-height: 1.5em; color: #b42318; }
    </style>
</head>
<body>
    <main>
        <h1>鲜配居管理后台</h1>
        <form id="login-form">
            <label for="password">管理员密码</label>
            <input id="password" type="password" autocomplete="current-password" required autofocus>
            <button id="submit" type="submit">登录</button>
            <p id="error" role="alert"></p>
        </form>
    </main>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('submit');
            const error = document.getElementById('error');
            button.disabled = true;
            error.textContent = '';
            try {
                const response = await fetch('/admin/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: document.getElementById('password').value })
                });
                const result = await response.json();
                if (!response.ok || !result.token) {
                    throw new Error(result.message || '登录失败');
                }
                sessionStorage.setItem('freshProduceAdminToken', result.token);
                window.location.replace('/admin-panel/index.html');
            } catch (failure) {
                error.textContent = failure.message || '网络请求失败';
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
