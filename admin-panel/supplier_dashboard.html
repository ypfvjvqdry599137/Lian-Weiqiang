<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鲜配居 - 供应商后台</title>
    <link rel="stylesheet" href="/admin-panel/css/style.css">
    <style>
        /* 可以根据需要添加供应商后台特有的样式 */
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="supplier-dashboard-title">🏭 供应商后台 - <span></span></h1>
            <button class="btn btn-danger" onclick="logout()">退出登录</button>
        </header>

        <nav class="sidebar">
            <ul class="menu">
                <li class="menu-item active" data-page="supplier-orders">备货单管理</li>
                <li class="menu-item" data-page="supplier-settlement">结算统计</li>
                <li class="menu-item" data-page="supplier-ingredients">原料管理</li>
            </ul>
        </nav>

        <main class="content">
            <div id="supplier-order-alert" class="supplier-order-alert" role="status" aria-live="polite">
                <div>
                    <strong id="supplier-alert-title">正在检查待备货订单…</strong>
                    <p id="supplier-alert-detail">保持后台页面打开，即可收到新单提醒。</p>
                </div>
                <div class="supplier-alert-actions">
                    <button class="btn btn-primary" type="button" id="supplier-alert-enable">开启声音和桌面提醒</button>
                    <button class="btn" type="button" id="supplier-alert-view">查看待备货</button>
                </div>
            </div>
            <!-- 备货单管理 -->
            <div id="page-supplier-orders" class="page active">
                <h2>📋 备货单管理</h2>
                <div class="tabs">
                    <button class="tab" data-status="all">全部</button>
                    <button class="tab active" data-status="10">待备货</button>
                    <button class="tab" data-status="unpaid">待付款</button>
                    <button class="tab" data-status="20">备货中</button>
                    <button class="tab" data-status="30">已完成</button>
                    <button class="tab" data-status="paused">售后暂停</button>
                    <button class="tab" data-status="refunded">已退款</button>
                    <button class="tab" data-status="40">已取消</button>
                </div>
                <div id="supplier-orders-summary" class="stats" style="margin-bottom: 20px;"></div>
                <div id="supplier-orders-list" class="data-list"></div>
            </div>

            <!-- 结算统计 -->
            <div id="page-supplier-settlement" class="page">
                <div class="page-header">
                    <h2>💰 结算统计</h2>
                    <div class="settlement-controls">
                        <input type="month" id="supplier-settlement-month">
                        <button class="btn btn-primary" onclick="loadSupplierSettlement()">查询</button>
                    </div>
                </div>
                <div id="supplier-settlement-summary" class="stats" style="margin-bottom: 20px;"></div>
                <div class="settlement-section">
                    <h3>每日汇总</h3>
                    <div id="supplier-settlement-daily" class="settlement-daily-grid"></div>
                </div>
                <div class="settlement-section">
                    <h3>备货单明细</h3>
                    <div id="supplier-settlement-orders" class="data-list"></div>
                </div>
            </div>

            <!-- 原料管理 -->
            <div id="page-supplier-ingredients" class="page">
                <div class="page-header">
                    <h2>🥬 我的原料</h2>
                </div>
                <div id="supplier-ingredients-list" class="data-list"></div>
            </div>
        </main>
    </div>

    <!-- 供应商原料编辑弹窗 -->
    <div id="supplier-ingredient-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('supplier-ingredient-modal')">&times;</span>
            <h2 id="supplier-ingredient-modal-title">维护原料</h2>
            <form id="supplier-ingredient-form">
                <input type="hidden" id="si-ingredient-id">
                <div class="form-group">
                    <label>原料名称</label>
                    <input type="text" id="si-ingredient-name" readonly>
                </div>
                <div class="form-group">
                    <label>单位</label>
                    <input type="text" id="si-ingredient-unit" readonly>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <input type="text" id="si-ingredient-category-name" readonly>
                </div>
                <div class="form-group">
                    <label>配送区域</label>
                    <input type="text" id="si-ingredient-zone-name" readonly>
                </div>
                <div class="form-group">
                    <label>申请新价格（需主后台审核）</label>
                    <input type="number" step="0.01" id="si-ingredient-price">
                    <div id="si-price-review-note" style="margin-top:8px;color:#b26a00;font-size:13px;line-height:1.6;"></div>
                </div>
                <div class="form-group">
                    <label>库存</label>
                    <input type="number" id="si-ingredient-stock" value="0">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <input type="text" id="si-ingredient-status" readonly>
                </div>
                <button type="submit" class="btn btn-primary">保存库存/提交改价申请</button>
            </form>
        </div>
    </div>

    <script src="/admin-panel/js/supplier-alerts.js"></script>
    <script>
        const BASE_URL = window.location.origin && window.location.origin !== 'null'
            ? window.location.origin
            : 'http://127.0.0.1:5000';
        let currentSupplierId = localStorage.getItem('supplier_id');
        let currentSupplierName = localStorage.getItem('supplier_name');
        let supplierToken = sessionStorage.getItem('supplier_token');

        if (!currentSupplierId || !currentSupplierName || !supplierToken) {
            alert('请先登录！');
            window.location.href = '/admin-panel/supplier_login.html';
        }

        document.getElementById('supplier-dashboard-title').querySelector('span').textContent = currentSupplierName;

        function logout() {
            localStorage.removeItem('supplier_id');
            localStorage.removeItem('supplier_name');
            sessionStorage.removeItem('supplier_token');
            window.location.href = '/admin-panel/supplier_login.html';
        }

        // ==================== 辅助函数 ====================
        async function fetchData(url, method = 'GET', data = null, showAlert = false) {
            const fullUrl = `${BASE_URL}${url}`;
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${supplierToken}`,
                },
            };
            if (data) {
                options.body = JSON.stringify(data);
            }

            try {
                const response = await fetch(fullUrl, options);
                if (response.status === 401 || response.status === 403) {
                    logout();
                    return null;
                }
                if (!response.ok) {
                    let errorMsg = `HTTP error! status: ${response.status}`;
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.message || errorMsg;
                    } catch (e) {}
                    throw new Error(errorMsg);
                }
                const result = await response.json();
                return result;
            } catch (error) {
                console.error('请求失败:', error);
                if (showAlert) {
                    alert('操作失败: ' + error.message);
                }
                return null;
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        function formatCurrency(value) {
            return `¥${(parseFloat(value) || 0).toFixed(2)}`;
        }

        function formatZoneName(zoneName) {
            return zoneName || '通用区域';
        }

        function getCurrentMonthValue() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            return `${now.getFullYear()}-${month}`;
        }

        function getSettlementMonthValue() {
            const input = document.getElementById('supplier-settlement-month');
            if (!input.value) {
                input.value = getCurrentMonthValue();
            }
            return input.value;
        }

        function showModal(id) {
            document.getElementById(id).classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        // ==================== 页面导航 ====================
        let currentPage = 'supplier-orders';

        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                currentPage = this.dataset.page;
                renderPage();
            });
        });

        async function renderPage() {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(`page-${currentPage}`).classList.add('active');

            switch (currentPage) {
                case 'supplier-orders':
                    await loadSupplierOrders();
                    break;
                case 'supplier-settlement':
                    await loadSupplierSettlement();
                    break;
                case 'supplier-ingredients':
                    await loadSupplierIngredients();
                    break;
            }
        }

        // ==================== 备货单管理 ====================

        let currentSupplierOrderStatusFilter = '10';

        document.querySelectorAll('#page-supplier-orders .tabs .tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('#page-supplier-orders .tabs .tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentSupplierOrderStatusFilter = this.dataset.status;
                loadSupplierOrders();
            });
        });

        function getSupplierOrderStatusText(status) {
            const statusMap = {
                10: '待备货',
                20: '备货中',
                30: '已完成',
                40: '已取消'
            };
            return statusMap[status] || '未知';
        }

        function renderSupplierOrdersSummary(summary) {
            const summaryEl = document.getElementById('supplier-orders-summary');
            if (!summaryEl || !summary) return;

            summaryEl.innerHTML = `
                <div class="stat-card">
                    <h3>今日材料费用</h3>
                    <p class="number">${formatCurrency(summary.today_total_cost)}</p>
                </div>
                <div class="stat-card">
                    <h3>当前列表费用</h3>
                    <p class="number">${formatCurrency(summary.filtered_total_cost)}</p>
                </div>
                <div class="stat-card">
                    <h3>今日备货单</h3>
                    <p class="number">${summary.today_order_count || 0}</p>
                </div>
            `;
        }

        async function loadSupplierOrders() {
            let url = `/supplier/orders?supplier_id=${currentSupplierId}`;
            if (currentSupplierOrderStatusFilter !== 'all') {
                url += `&status=${currentSupplierOrderStatusFilter}`;
            }
            const ordersData = await fetchData(url);
            const ordersList = document.getElementById('supplier-orders-list');
            ordersList.innerHTML = '';
            renderSupplierOrdersSummary(ordersData ? ordersData.summary : null);

            if (ordersData && ordersData.supplier_orders) {
                ordersData.supplier_orders.forEach(order => {
                    const card = document.createElement('div');
                    card.classList.add('data-card', `status-${order.status}`);
                    if (order.fulfillment_notice) card.classList.add('status-after-sale');
                    const itemsHtml = order.items ? order.items.map(item => `
                        <p>${item.ingredient_name} x ${item.quantity} ${item.unit} | 单价 ${formatCurrency(item.unit_price)} | 小计 ${formatCurrency(item.total_price)}</p>
                    `).join('') : '';
                    card.innerHTML = `
                        <div class="data-card-content">
                            <h4>备货单 #${order.id} <span style="float:right;color:#666;">${order.status_text}</span></h4>
                            ${order.fulfillment_notice ? `<p class="refund-warning">${order.fulfillment_notice}</p>` : ''}
                            <p>关联订单号: ${order.order_sn} | 备货区域: ${formatZoneName(order.zone_name)}</p>
                            <p>材料费用: ${formatCurrency(order.total_cost)}</p>
                            <p>备注: ${order.notes || '无'}</p>
                            <div style="margin-top:10px;padding-top:10px;border-top:1px solid #eee;">
                                ${itemsHtml}
                            </div>
                            <p style="font-size:12px;color:#999;margin-top:10px;">创建时间: ${formatDate(order.created_at)}</p>
                        </div>
                        <div class="data-card-actions">
                            ${renderSupplierOrderActions(order)}
                        </div>
                    `;
                    ordersList.appendChild(card);
                });
            }
        }

        function renderSupplierOrderActions(order) {
            if (order.fulfillment_notice) {
                return `<span class="status-note">${order.fulfillment_notice}</span>`;
            }
            const status = Number(order.status);
            if (status === 10) {
                return `
                    <button class="btn btn-sm btn-success" onclick="updateSupplierOrderStatus(${order.id}, 20, '开始备货')">开始备货</button>
                    <button class="btn btn-sm btn-primary" onclick="updateSupplierOrderStatus(${order.id}, 30, '配齐')">配齐</button>
                `;
            }
            if (status === 20) {
                return `<button class="btn btn-sm btn-primary" onclick="updateSupplierOrderStatus(${order.id}, 30, '配齐')">配齐</button>`;
            }
            if (status === 30) {
                return '<span class="status-note">已配齐</span>';
            }
            if (status === 40) {
                return '<span class="status-note">已取消</span>';
            }
            return '';
        }

        async function updateSupplierOrderStatus(orderId, newStatus, actionText) {
            const confirmText = newStatus === 30 ? '确认该备货单已经全部配齐吗？' : `确认${actionText}吗？`;
            if (!confirm(confirmText)) return;

            const result = await fetchData(`/supplier/orders/${orderId}/status?supplier_id=${currentSupplierId}`, 'PUT', { status: newStatus }, true);
            if (result) {
                alert(result.message || `${actionText}成功`);
                if (currentPage === 'supplier-settlement') {
                    await loadSupplierSettlement();
                } else {
                    await loadSupplierOrders();
                }
            }
        }

        // ==================== 结算统计 ====================

        function renderSupplierSettlementSummary(summary) {
            const summaryEl = document.getElementById('supplier-settlement-summary');
            if (!summaryEl || !summary) return;

            summaryEl.innerHTML = `
                <div class="stat-card">
                    <h3>${summary.month} 可结算金额</h3>
                    <p class="number">${formatCurrency(summary.payable_total)}</p>
                </div>
                <div class="stat-card">
                    <h3>待确认金额</h3>
                    <p class="number">${formatCurrency(summary.pending_total)}</p>
                </div>
                <div class="stat-card">
                    <h3>本月备货总额</h3>
                    <p class="number">${formatCurrency(summary.total_cost)}</p>
                </div>
                <div class="stat-card">
                    <h3>已完成 / 待确认</h3>
                    <p class="number">${summary.completed_count || 0} / ${summary.pending_count || 0}</p>
                </div>
                <div class="stat-card">
                    <h3>售后待处理 / 已退款</h3>
                    <p class="number">${summary.on_hold_count || 0} / ${summary.refunded_count || 0}</p>
                </div>
                <div class="stat-card">
                    <h3>待付款订单</h3>
                    <p class="number">${summary.unpaid_count || 0}</p>
                </div>
            `;
        }

        function renderSupplierSettlementDaily(dailyTotals) {
            const dailyEl = document.getElementById('supplier-settlement-daily');
            dailyEl.innerHTML = '';

            if (!dailyTotals || dailyTotals.length === 0) {
                dailyEl.innerHTML = '<div class="empty-state">本月暂无备货记录</div>';
                return;
            }

            dailyTotals.forEach(day => {
                const item = document.createElement('div');
                item.className = 'settlement-daily-card';
                item.innerHTML = `
                    <h4>${day.date}</h4>
                    <p>可结算: <strong>${formatCurrency(day.payable_total)}</strong></p>
                    <p>待确认: ${formatCurrency(day.pending_total)}</p>
                    <p>备货单: ${day.order_count || 0} 单</p>
                `;
                dailyEl.appendChild(item);
            });
        }

        function renderSupplierSettlementOrders(orders) {
            const ordersEl = document.getElementById('supplier-settlement-orders');
            ordersEl.innerHTML = '';

            if (!orders || orders.length === 0) {
                ordersEl.innerHTML = '<div class="empty-state">本月暂无备货单明细</div>';
                return;
            }

            orders.forEach(order => {
                const card = document.createElement('div');
                card.classList.add('data-card', `status-${order.status}`);
                if (order.fulfillment_notice) card.classList.add('status-after-sale');
                const itemsHtml = order.items ? order.items.map(item => `
                    <p>${item.ingredient_name} x ${item.quantity} ${item.unit} | 单价 ${formatCurrency(item.unit_price)} | 小计 ${formatCurrency(item.total_price)}</p>
                `).join('') : '';
                const actionHtml = renderSupplierOrderActions(order);


                card.innerHTML = `
                    <div class="data-card-content">
                        <h4>备货单 #${order.id} <span style="float:right;color:#666;">${order.status_text}</span></h4>
                        <p>关联订单号: ${order.order_sn} | 备货区域: ${formatZoneName(order.zone_name)}</p>
                        <p>材料费用: ${formatCurrency(order.total_cost)}</p>
                        <div style="margin-top:10px;padding-top:10px;border-top:1px solid #eee;">
                            ${itemsHtml}
                        </div>
                        <p style="font-size:12px;color:#999;margin-top:10px;">创建时间: ${formatDate(order.created_at)}</p>
                    </div>
                    <div class="data-card-actions">
                        ${actionHtml}
                    </div>
                `;
                ordersEl.appendChild(card);
            });
        }

        async function loadSupplierSettlement() {
            const month = getSettlementMonthValue();
            const data = await fetchData(`/supplier/settlement?supplier_id=${currentSupplierId}&month=${encodeURIComponent(month)}`);

            if (!data) {
                return;
            }

            renderSupplierSettlementSummary(data.summary);
            renderSupplierSettlementDaily(data.daily_totals);
            renderSupplierSettlementOrders(data.supplier_orders);
        }

        // ==================== 原料管理 ====================

        async function loadSupplierIngredients() {
            const ingredientsData = await fetchData(`/supplier/ingredients?supplier_id=${currentSupplierId}`);
            const ingredientsList = document.getElementById('supplier-ingredients-list');
            ingredientsList.innerHTML = '';

            if (ingredientsData && ingredientsData.ingredients) {
                ingredientsData.ingredients.forEach(ingredient => {
                    const card = document.createElement('div');
                    card.classList.add('data-card');
                    card.innerHTML = `
                        <div class="data-card-content">
                            <h4>${ingredient.name}</h4>
                            <p>单位: ${ingredient.unit} | 分类: ${ingredient.category_name || '无'} | 区域: ${formatZoneName(ingredient.zone_name)}</p>
                            <p>价格: ${ingredient.price ? '¥' + ingredient.price : '未设置'} | 库存: ${ingredient.stock}</p>
                            ${ingredient.pending_price_request ? `<p style="color:#b26a00;">待审核新价: ${formatCurrency(ingredient.pending_price_request.requested_price)}</p>` : ''}
                            <p>状态: ${ingredient.is_active ? '已启用' : '已禁用'}</p>
                        </div>
                        <div class="data-card-actions">
                            <button class="btn btn-sm btn-success" onclick="showSupplierIngredientModal(${ingredient.id})">维护价格库存</button>
                        </div>
                    `;
                    ingredientsList.appendChild(card);
                });
            }
        }

        async function showSupplierIngredientModal(ingredientId) {
            const title = document.getElementById('supplier-ingredient-modal-title');
            const form = document.getElementById('supplier-ingredient-form');
            form.reset();
            document.getElementById('si-ingredient-id').value = '';
            document.getElementById('si-ingredient-stock').value = '0';

            title.textContent = '维护原料';
            const ingredient = await fetchData(`/supplier/ingredients/${ingredientId}?supplier_id=${currentSupplierId}`);
            if (ingredient) {
                document.getElementById('si-ingredient-id').value = ingredient.id;
                document.getElementById('si-ingredient-name').value = ingredient.name;
                document.getElementById('si-ingredient-unit').value = ingredient.unit;
                document.getElementById('si-ingredient-category-name').value = ingredient.category_name || '无';
                document.getElementById('si-ingredient-zone-name').value = formatZoneName(ingredient.zone_name);
                document.getElementById('si-ingredient-price').value = ingredient.pending_price_request ? ingredient.pending_price_request.requested_price || '' : ingredient.price || '';
                const priceNote = document.getElementById('si-price-review-note');
                priceNote.textContent = ingredient.pending_price_request
                    ? `已有待审核申请：当前价 ${formatCurrency(ingredient.pending_price_request.old_price)}，申请新价 ${formatCurrency(ingredient.pending_price_request.requested_price)}。再次保存会更新这条申请。`
                    : '当前价格如果需要调整，提交后会进入主后台审核，通过后才会生效。';
                document.getElementById('si-ingredient-stock').value = ingredient.stock;
                document.getElementById('si-ingredient-status').value = ingredient.is_active ? '已启用' : '已禁用';
                showModal('supplier-ingredient-modal');
            }
        }

        document.getElementById('supplier-ingredient-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const ingredientId = document.getElementById('si-ingredient-id').value;
            const data = {
                price: document.getElementById('si-ingredient-price').value ? parseFloat(document.getElementById('si-ingredient-price').value) : null,
                stock: parseInt(document.getElementById('si-ingredient-stock').value) || 0
            };

            const result = await fetchData(`/supplier/ingredients/${ingredientId}?supplier_id=${currentSupplierId}`, 'PUT', data, true);
            if (result) {
                alert(result.message || '保存成功！');
                closeModal('supplier-ingredient-modal');
                await loadSupplierIngredients();
            }
        });

        // ==================== 新备货单在线提醒 ====================
        const supplierAlertTracker = new SupplierAlertTracker();
        const supplierDashboardTitle = document.title;
        let alertPollBusy = false;
        let pendingAlertCount = 0;
        let newAlertCount = 0;
        let newAlertUntil = 0;
        let alertSoundContext = null;
        let alertSoundEnabled = false;

        function playSupplierAlertSound() {
            if (!alertSoundEnabled || !alertSoundContext) return;
            alertSoundContext.resume().then(() => {
                const start = alertSoundContext.currentTime;
                [0, 0.24].forEach(delay => {
                    const oscillator = alertSoundContext.createOscillator();
                    const volume = alertSoundContext.createGain();
                    oscillator.type = 'sine';
                    oscillator.frequency.value = 880;
                    volume.gain.setValueAtTime(0.001, start + delay);
                    volume.gain.exponentialRampToValueAtTime(0.16, start + delay + 0.02);
                    volume.gain.exponentialRampToValueAtTime(0.001, start + delay + 0.18);
                    oscillator.connect(volume).connect(alertSoundContext.destination);
                    oscillator.start(start + delay);
                    oscillator.stop(start + delay + 0.19);
                });
            }).catch(() => {});
        }

        function updateSupplierAlertBanner(error = false) {
            const banner = document.getElementById('supplier-order-alert');
            const headline = document.getElementById('supplier-alert-title');
            const detail = document.getElementById('supplier-alert-detail');
            const showingNew = Date.now() < newAlertUntil;
            banner.classList.toggle('has-pending', pendingAlertCount > 0);
            banner.classList.toggle('has-new', showingNew);
            document.title = pendingAlertCount ? `【${pendingAlertCount} 单待备货】${supplierDashboardTitle}` : supplierDashboardTitle;
            headline.textContent = error ? '订单提醒暂时连接失败' :
                showingNew ? `新备货单 ${newAlertCount} 单，请及时处理` :
                pendingAlertCount ? `当前有 ${pendingAlertCount} 单待备货` : '当前没有待备货订单';
            detail.textContent = error ? '请检查网络连接，页面会自动重试。' :
                '仅提醒已付款且未进入售后处理的订单；保持后台页面打开。';
        }

        async function refreshSupplierOrderAlerts() {
            if (alertPollBusy || !supplierToken) return;
            alertPollBusy = true;
            try {
                const data = await fetchData(`/supplier/order-alerts?supplier_id=${currentSupplierId}`);
                if (!data || !Array.isArray(data.pending_ids)) {
                    updateSupplierAlertBanner(true);
                    return;
                }
                const hadSnapshot = supplierAlertTracker.previousIds !== null;
                const { pendingCount, newOrders } = supplierAlertTracker.update(data.pending_ids.map(id => ({ id })));
                const listChanged = pendingCount !== pendingAlertCount;
                pendingAlertCount = pendingCount;
                if (newOrders.length) {
                    newAlertCount = newOrders.length;
                    newAlertUntil = Date.now() + 30000;
                    playSupplierAlertSound();
                    if (alertSoundEnabled && 'Notification' in window && Notification.permission === 'granted') {
                        try {
                            new Notification('鲜配居：收到新备货单', {
                                body: `有 ${newOrders.length} 单新备货任务，请打开供应商后台处理。`,
                                tag: `supplier-orders-${currentSupplierId}`
                            });
                        } catch (error) { console.warn('桌面提醒不可用:', error); }
                    }
                }
                if (hadSnapshot && (listChanged || newOrders.length)
                    && currentPage === 'supplier-orders' && currentSupplierOrderStatusFilter === '10') {
                    await loadSupplierOrders();
                }
                updateSupplierAlertBanner();
            } finally {
                alertPollBusy = false;
            }
        }

        document.getElementById('supplier-alert-enable').addEventListener('click', async function() {
            let desktopPermissionRequest = null;
            if ('Notification' in window && Notification.permission === 'default') {
                try { desktopPermissionRequest = Notification.requestPermission(); } catch (error) {}
            }
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass && !alertSoundContext) {
                try {
                    alertSoundContext = new AudioContextClass();
                    await alertSoundContext.resume();
                    alertSoundEnabled = true;
                } catch (error) {
                    console.warn('声音提醒不可用:', error);
                }
            }
            if (desktopPermissionRequest) {
                try { await desktopPermissionRequest; } catch (error) {}
            }
            const desktopEnabled = 'Notification' in window && Notification.permission === 'granted';
            this.textContent = alertSoundEnabled
                ? (desktopEnabled ? '声音与桌面提醒已开启' : '声音提醒已开启')
                : (desktopEnabled ? '桌面提醒已开启' : '声音提醒不可用');
            this.disabled = alertSoundEnabled || desktopEnabled;
            if (pendingAlertCount > 0) playSupplierAlertSound();
        });

        document.getElementById('supplier-alert-view').addEventListener('click', () => {
            document.querySelectorAll('.menu-item').forEach(item =>
                item.classList.toggle('active', item.dataset.page === 'supplier-orders'));
            document.querySelectorAll('#page-supplier-orders .tabs .tab').forEach(tab =>
                tab.classList.toggle('active', tab.dataset.status === '10'));
            currentPage = 'supplier-orders';
            currentSupplierOrderStatusFilter = '10';
            renderPage();
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) refreshSupplierOrderAlerts();
        });

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('supplier-settlement-month').value = getCurrentMonthValue();
            renderPage();
            refreshSupplierOrderAlerts();
            setInterval(refreshSupplierOrderAlerts, 20000);
        });

    </script>
</body>
</html>
