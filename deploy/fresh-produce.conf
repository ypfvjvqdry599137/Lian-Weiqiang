server {
    listen 80;
    server_name xianpeiju.site www.xianpeiju.site;

    location /admin-panel/ {
        alias /home/ubuntu/Lian-Weiqiang/admin-panel/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location ^~ /uploads/products/ {
        alias /srv/fresh-produce/uploads/products/;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name xianpeiju.site www.xianpeiju.site;

    location /admin-panel/ {
        alias /home/ubuntu/Lian-Weiqiang/admin-panel/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location ^~ /uploads/products/ {
        alias /srv/fresh-produce/uploads/products/;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/xianpeiju.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xianpeiju.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
